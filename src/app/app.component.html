<app-login-modal
  [isOpen]="showLoginModal"
  (closeModal)="closeLoginModal()"
  (loginSubmit)="handleLogin($event)"
  (switchModal)="switchToRegister()"
></app-login-modal>

<app-register-modal
  [isOpen]="showRegisterModal"
  (closeModal)="closeRegisterModal()"
  (registerSubmit)="handleRegister($event)"
  (switchModal)="switchToLogin()"
></app-register-modal>

<div class="max-w-7xl mx-auto py-8 px-6">
  <header>
    <div class="flex items-center justify-between">
      <h1 class="text-[30px] font-bold text-daidai">
        <a routerLink="/brands" class="hover:opacity-80 transition"
          >TrendClip</a
        >
      </h1>
      <div class="flex items-center gap-3">
        @if (user) {
          <div class="flex items-center gap-2">
            <app-icon
              name="user_icon"
              size="24px"
              containerClass="rounded-full text-daidai"
            />
            <span class="text-sm font-medium text-gray-600 hidden md:block">{{
              user.name
            }}</span>
          </div>
          <button
            (click)="logout()"
            class="text-xs font-bold text-gray-400 hover:text-pink-500 transition-colors"
          >
            ログアウト
          </button>
        } @else {
          <button
            (click)="login()"
            class="bg-daidai text-white px-4 py-2 rounded-full text-sm font-bold hover:bg-[#cc5555] transition-all shadow-md shadow-pink-100"
          >
            ログイン
          </button>
        }
      </div>
    </div>
    <p class="mb-8">お気に入りのブランドを管理して最新動向をチェック</p>
  </header>

  <main>
    <section class="content">
      <router-outlet />
    </section>
  </main>
</div>
