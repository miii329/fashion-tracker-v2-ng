<div class="max-w-3xl mx-auto mt-6 px-4">
  @if (isLoading) {
    <div class="mt-6 text-gray-500">読み込み中...</div>
  } @else if (errorMessage) {
    <div class="mt-6 text-red-500">{{ errorMessage }}</div>
  } @else if (brand) {
    <div class="mt-6 border rounded-lg p-6 bg-white shadow-sm space-y-4">
      <div class="flex items-center gap-3">
        @if (faviconUrl && !faviconLoadError) {
          <img
            [src]="faviconUrl"
            [alt]="brand.name + ' icon'"
            class="w-10 h-10 rounded"
            (error)="onFaviconError()"
          />
        }
        <h1 class="text-2xl font-bold">{{ brand.name }}</h1>
      </div>

      <p class="text-sm text-gray-600">カテゴリ: {{ brand.category }}</p>

      @if (brand.description) {
        <p class="text-sm leading-6">{{ brand.description }}</p>
      }

      @if (brand.url) {
        <a
          [href]="brand.url"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-block text-blue-500 hover:underline text-sm"
        >
          公式サイトを開く →
        </a>
      }
    </div>
  }
</div>
