<app-edit-modal-base
  [isOpen]="isOpen"
  title="お気に入り商品を追加"
  submitLabel="追加"
  [isSubmitDisabled]="!isValid"
  (close)="close()"
  (submit)="onSubmit()"
>
  <form class="space-y-4">
    <div>
      <label
        for="itemName"
        class="block text-sm font-medium text-gray-700 mb-1"
      >
        商品名 <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        id="itemName"
        [(ngModel)]="item.itemName"
        name="itemName"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="商品名を入力"
      />
    </div>

    <div>
      <label
        for="brandName"
        class="block text-sm font-medium text-gray-700 mb-1"
      >
        ブランド名 <span class="text-red-500">*</span>
      </label>
      @if (isLoadingBrands) {
        <div class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-50 text-gray-500">
          読み込み中...
        </div>
      } @else {
        <select
          id="brandName"
          [(ngModel)]="item.brandName"
          name="brandName"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
        >
          <option value="">選択してください</option>
          @for (brand of brands; track brand.id) {
          <option [value]="brand.name">{{ brand.name }}</option>
          }
        </select>
      }
    </div>

    <div>
      <label
        for="category"
        class="block text-sm font-medium text-gray-700 mb-1"
      >
        カテゴリ <span class="text-red-500">*</span>
      </label>
      <select
        id="category"
        [(ngModel)]="item.category"
        name="category"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      >
        <option value="">選択してください</option>
        @for (category of categories; track category) {
        <option [value]="category">{{ category }}</option>
        }
      </select>
    </div>

    <div>
      <label for="price" class="block text-sm font-medium text-gray-700 mb-1">
        価格（円）
      </label>
      <input
        type="number"
        id="price"
        [(ngModel)]="item.price"
        name="price"
        min="0"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="4990"
      />
    </div>

    <div>
      <label for="memo" class="block text-sm font-medium text-gray-700 mb-1">
        メモ
      </label>
      <textarea
        id="memo"
        [(ngModel)]="item.memo"
        name="memo"
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="商品についてのメモ..."
      ></textarea>
    </div>

    <div>
      <label for="url" class="block text-sm font-medium text-gray-700 mb-1">
        商品URL
      </label>
      <input
        type="url"
        id="url"
        [(ngModel)]="item.url"
        name="url"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="https://example.com/item/12345"
      />
    </div>
  </form>
</app-edit-modal-base>
