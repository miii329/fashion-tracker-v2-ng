<app-category-tabs
  [selectedCategory]="currentCategory"
  (categoryChange)="onCategoryChanged($event)"
>
</app-category-tabs>
<!-- 追加ボタン -->
<app-add-button
  class="flex justify-end mb-4"
  label="お気に入りを追加"
  (btnClick)="openAddModal()"
>
</app-add-button>
<!-- お気に入り商品一覧をグリッド表示 -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
  @for (item of filteredFavorites; track item.id) {
    <app-favorite-item-card [item]="item"></app-favorite-item-card>
  } @empty {
    <div class="col-span-full text-center py-10 text-gray-400">
      @if (showLoginRequiredMessage) {
        <p>ログインするとお気に入り商品を表示できます。</p>
      } @else {
        <p>該当するカテゴリーのお気に入り商品は登録されていません。</p>
      }
    </div>
  }
</div>
<!-- お気に入り商品入力モーダル -->
<app-favorite-item-input-modal
  [isOpen]="isModalOpen"
  [item]="newItem"
  (closeModal)="closeModal()"
  (submitItem)="submitItem($event)"
></app-favorite-item-input-modal>
