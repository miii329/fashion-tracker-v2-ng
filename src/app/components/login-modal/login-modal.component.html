@if (isOpen) {
  <div
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    (click)="close()"
  >
    <div
      class="bg-white rounded-lg p-8 max-w-md w-full mx-4"
      (click)="$event.stopPropagation()"
    >
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">ログイン</h2>
        <button
          (click)="close()"
          class="text-gray-400 hover:text-gray-600 text-2xl"
        >
          &times;
        </button>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1"
            >メールアドレス</label
          >
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-daidai focus:border-transparent"
            placeholder="example@email.com"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
            >パスワード</label
          >
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-daidai focus:border-transparent"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-daidai text-white py-2 rounded-lg font-bold hover:bg-[#cc5555] transition-all shadow-md"
        >
          ログイン
        </button>
      </form>

      <div class="mt-4 text-center">
        <p class="text-sm text-gray-600">
          アカウントをお持ちでないですか？
          <a
            href="#"
            (click)="switchToRegister($event)"
            class="text-daidai font-medium hover:underline"
            >新規登録</a
          >
        </p>
      </div>
    </div>
  </div>
}
